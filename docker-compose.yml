version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: edu-les-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: edu_les
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edu-les-network

  redis:
    image: redis:7-alpine
    container_name: edu-les-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - edu-les-network

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: edu-les-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@edu-les.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - edu-les-network

volumes:
  postgres_data:
  redis_data:

networks:
  edu-les-network:
    driver: bridge