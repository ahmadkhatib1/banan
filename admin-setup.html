<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعداد حساب المسؤول الأول - منصة التعليم</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            direction: ltr;
            text-align: left;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-check {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }

        .status-check.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📚</div>
        <h1>منصة التعليم الإلكتروني</h1>
        <p class="subtitle">إعداد حساب المسؤول الأول</p>

        <div id="statusCheck" class="status-check">
            <p>جاري التحقق من حالة النظام...</p>
            <div class="spinner"></div>
        </div>

        <div id="alertContainer"></div>

        <form id="adminForm" style="display: none;">
            <div class="form-group">
                <label for="firstName">الاسم الأول</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>

            <div class="form-group">
                <label for="lastName">الاسم الأخير</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>

            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required minlength="8">
            </div>

            <div class="form-group">
                <label for="confirmPassword">تأكيد كلمة المرور</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>

            <button type="submit" class="btn" id="submitBtn">إنشاء حساب المسؤول</button>
        </form>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>جاري إنشاء الحساب...</p>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        
        // Check setup status on page load
        window.addEventListener('DOMContentLoaded', checkSetupStatus);

        async function checkSetupStatus() {
            try {
                const response = await fetch(`${API_BASE}/admin/check-setup`);
                const data = await response.json();

                const statusCheck = document.getElementById('statusCheck');
                const adminForm = document.getElementById('adminForm');
                const alertContainer = document.getElementById('alertContainer');

                if (data.success) {
                    if (data.setupRequired) {
                        // Setup is required, show the form
                        statusCheck.style.display = 'none';
                        adminForm.style.display = 'block';
                        showAlert('يمكنك الآن إنشاء حساب المسؤول الأول', 'success');
                    } else {
                        // Admin already exists
                        statusCheck.style.display = 'none';
                        showAlert('تم إنشاء حساب المسؤول مسبقاً. يمكنك تسجيل الدخول من خلال التطبيق الرئيسي.', 'success');
                    }
                } else {
                    statusCheck.style.display = 'none';
                    showAlert('خطأ في التحقق من حالة النظام: ' + data.message, 'error');
                }
            } catch (error) {
                console.error('Error checking setup status:', error);
                document.getElementById('statusCheck').style.display = 'none';
                showAlert('خطأ في الاتصال بالخادم. تأكد من تشغيل الخادم على المنفذ 5000', 'error');
            }
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert ${type}">
                    ${message}
                </div>
            `;
            alertContainer.querySelector('.alert').style.display = 'block';
        }

        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            // Validate password confirmation
            if (data.password !== data.confirmPassword) {
                showAlert('كلمات المرور غير متطابقة', 'error');
                return;
            }

            // Remove confirmPassword from data
            delete data.confirmPassword;

            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const form = document.getElementById('adminForm');

            try {
                // Show loading state
                submitBtn.disabled = true;
                form.style.display = 'none';
                loading.style.display = 'block';

                const response = await fetch(`${API_BASE}/admin/setup-first-admin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                // Hide loading state
                loading.style.display = 'none';

                if (result.success) {
                    showAlert('تم إنشاء حساب المسؤول بنجاح! يمكنك الآن تسجيل الدخول من خلال التطبيق الرئيسي.', 'success');
                } else {
                    form.style.display = 'block';
                    submitBtn.disabled = false;
                    showAlert('خطأ: ' + result.message, 'error');
                }
            } catch (error) {
                console.error('Error creating admin:', error);
                loading.style.display = 'none';
                form.style.display = 'block';
                submitBtn.disabled = false;
                showAlert('خطأ في الاتصال بالخادم', 'error');
            }
        });
    </script>
</body>
</html>
